org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# JDK 17 is required for AGP 8.7.3. Set this to your JDK 17 path.
# If unset, Gradle uses JAVA_HOME. Common locations:
#   /opt/android-studio/jbr          (Android Studio bundled JBR)
#   /usr/lib/jvm/java-17-openjdk     (System JDK 17)
org.gradle.java.home=/opt/android-studio/jbr

# Version affichée = <appVersionBase>.<numéro de build> (ex. 0.2.152), le numéro de build étant le run_number
# de la CI. Le tag de release est v<version>. Doit rester supérieure aux anciennes versions 0.1.x.
appVersionBase=0.2
# Les anciens APK (CI avant lielugit-updater) avaient versionCode = 1000 + run_number : on garde ce
# décalage pour que le versionCode continue de croître strictement par-dessus eux.
versionCodeOffset=1000
